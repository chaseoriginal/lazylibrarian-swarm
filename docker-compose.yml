services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest@sha256:f3084b5408b52f6012581e8ab50c5130e9eb7ac239189bd6ad3a1d2104123717
    container_name: lazylibrarian-swarm
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - lazylibrarian-swarm_config:/config
    - /media/Multimedia/Books:/books
    - /media/Multimedia/Incoming:/downloads
    ports:
    - target: 5299
      published: 5299
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  lazylibrarian-swarm_config:
    name: lazylibrarian-swarm_config
