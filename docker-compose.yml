services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest@sha256:9b6ec477eef3d688067ce58f6957d11de91e9b576b99c8b83848103f7ebb4e2a@sha256:9b6ec477eef3d688067ce58f6957d11de91e9b576b99c8b83848103f7ebb4e2a
    container_name: lazylibrarian-swarm
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - lazylibrarian-swarm_config:/config
    - /media/Multimedia/Books:/books
    - /media/Multimedia/Incoming:/downloads
    ports:
    - target: 5299
      published: 5299
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  lazylibrarian-swarm_config:
    name: lazylibrarian-swarm_config
