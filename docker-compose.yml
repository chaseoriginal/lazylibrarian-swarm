services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest@sha256:921a298a5c03e677172275c57c767110987a4a6f2367e9529b6333fab9d58700
    container_name: lazylibrarian-swarm
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - lazylibrarian-swarm_config:/config
    - /media/Multimedia/Books:/books
    - /media/Multimedia/Incoming:/downloads
    ports:
    - target: 5299
      published: 5299
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  lazylibrarian-swarm_config:
    name: lazylibrarian-swarm_config
