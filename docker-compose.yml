services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest@sha256:7eef0822e609909ab36f93ff2bc7339e4a004e8446be09c02dee9c6be40ebd16
    container_name: lazylibrarian-swarm
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - lazylibrarian-swarm_config:/config
    - /media/Multimedia/Books:/books
    - /media/Multimedia/Incoming:/downloads
    ports:
    - target: 5299
      published: 5299
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  lazylibrarian-swarm_config:
    name: lazylibrarian-swarm_config
