services:
  lazylibrarian:
    image: lscr.io/linuxserver/lazylibrarian:latest@sha256:1130d19d5efd0278a72173dc83f1ac1747cc2c5a7a7fa71f1baeace9731c6d9b
    container_name: lazylibrarian-swarm
    environment:
    - PUID=1000
    - PGID=33
    - TZ=America/Chicago
    - DOCKER_MODS=linuxserver/mods:universal-calibre|linuxserver/mods:lazylibrarian-ffmpeg
    volumes:
    - lazylibrarian-swarm_config:/config
    - /media/Multimedia/Books:/books
    - /media/Multimedia/Incoming:/downloads
    ports:
    - target: 5299
      published: 5299
      protocol: tcp
      mode: host
    deploy:
      placement:
        constraints:
        - node.role==manager
      restart_policy:
        condition: on-failure
volumes:
  lazylibrarian-swarm_config:
    name: lazylibrarian-swarm_config
